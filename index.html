  <title>Photo Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eee;
      color: #111;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 24px 16px 16px;
    }

    header img {
      height: 48px;
      width: auto;
    }

    .gallery-track-wrapper {
      width: 100%;
      overflow-x: scroll;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
      scroll-snap-type: x mandatory;
    }

    .gallery-track-wrapper::-webkit-scrollbar {
      display: none; /* Chrome/Safari/Opera */
    }

    .gallery-track {
      display: flex;
      width: max-content;
    }

    .gallery-track img {
      width: 100vw;
      height: calc(100svh - 96px);
      display: block;
      object-fit: contain;
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .gallery-track-wrapper {
        scroll-snap-type: none;
        padding: 16px 0 24px;
      }

      .gallery-track img {
        width: auto;
        height: 70vh;
        object-fit: cover;
        scroll-snap-align: none;
      }
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      font-size: 36px;
      line-height: 1;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      opacity: 0.8;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    .lightbox-prev,
    .lightbox-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 36px;
      line-height: 1;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      opacity: 0.7;
      padding: 16px;
      user-select: none;
    }

    .lightbox-prev { left: 4px; }
    .lightbox-next { right: 4px; }

    .lightbox-prev:hover,
    .lightbox-next:hover {
      opacity: 1;
    }
  </style>
</head>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <button class="lightbox-prev" id="lightbox-prev">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-next" id="lightbox-next">&#8250;</button>
  </div>

  <script>
    const images = Array.from(document.querySelectorAll('#gallery img'));
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let current = 0;

    function openLightbox(index) {
      current = index;
      lightboxImg.src = images[current].src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function showPrev() {
      current = (current - 1 + images.length) % images.length;
      lightboxImg.src = images[current].src;
    }

    function showNext() {
      current = (current + 1) % images.length;
      lightboxImg.src = images[current].src;
    }

    const wrapper = document.querySelector('.gallery-track-wrapper');

    images.forEach((img, i) => {
      img.addEventListener('click', (e) => {
        if (window.innerWidth < 768) {
          const target = e.clientX > window.innerWidth / 2
            ? Math.min(i + 1, images.length - 1)
            : Math.max(i - 1, 0);
          wrapper.scrollTo({ left: target * window.innerWidth, behavior: 'smooth' });
        } else {
          openLightbox(i);
        }
      });
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', showPrev);
    document.getElementById('lightbox-next').addEventListener('click', showNext);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });
  </script>
